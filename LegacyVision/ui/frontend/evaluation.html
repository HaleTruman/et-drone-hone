<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend Evaluation Overlay Review</title>
    <link rel="stylesheet" href="styles.css?v=evaluation-overlay-v1" />
  </head>
  <body>
    <main class="viewer-shell">
      <nav class="viewer-tabs" aria-label="Review pipelines">
        <a href="source.html">source</a>
        <a href="index.html">DensityEvidence</a>
        <a href="topology.html">TopologyDecision.topology_label</a>
        <a href="standard_gate.html">StandardGateResult</a>
        <a href="pnp_scene.html">PnP / final pose replay</a>
        <a class="active" href="evaluation.html">backend evaluation overlays</a>
      </nav>
      <header class="viewer-header evaluation-header" aria-label="Backend evaluation navigation">
        <section class="header-section controls-left">
          <select id="evaluation-select" aria-label="Evaluation"></select>
          <select id="overlay-layer-select" aria-label="Overlay layer"></select>
        </section>
        <section class="header-section controls-center">
          <div class="frame-slider-wrap">
            <input id="frame-slider" type="range" min="0" max="0" value="0" disabled />
            <div id="frame-meta">Frame 0 / 0</div>
          </div>
        </section>
        <section class="header-section controls-right evaluation-filters">
          <label>
            <input id="changed-only" type="checkbox" />
            <span>comparison.changed</span>
          </label>
          <button id="previous-frame" type="button" aria-label="Previous frame" disabled>Previous</button>
          <button id="next-frame" type="button" aria-label="Next frame" disabled>Next</button>
        </section>
      </header>
      <section class="frame-container" aria-live="polite">
        <div id="frame-message">Loading backend evaluation overlays...</div>
        <div id="evaluation-summary" class="evaluation-summary" hidden></div>
        <div id="evaluation-grid" class="evaluation-grid" hidden></div>
      </section>
    </main>
    <script type="module" src="evaluation_app.js?v=evaluation-overlay-v1"></script>
    <script type="module" src="magnifier.js?v=canvas-v1"></script>
  </body>
</html>
