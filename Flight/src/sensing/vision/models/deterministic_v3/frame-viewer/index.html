<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deterministic V3 Mask Review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewer-shell">
      <nav class="viewer-tabs" aria-label="Review pipelines">
        <a class="active" href="index.html">Detector layers</a>
        <a href="legacy.html">Calibrated legacy inverse density</a>
      </nav>
      <header class="viewer-header" aria-label="Frame navigation">
        <section class="header-section controls-left">
          <select id="run-select" aria-label="Run"></select>
          <label id="density-sweep-control" class="density-sweep-control" hidden>
            <span>Legacy sweep <output id="density-sweep-output"></output></span>
            <input id="density-sweep-slider" type="range" min="0" max="0" value="0" />
          </label>
        </section>
        <section class="header-section controls-center">
          <div class="frame-slider-wrap">
            <input id="frame-slider" type="range" min="0" max="0" value="0" disabled />
            <div id="frame-meta">Frame 0 / 0</div>
          </div>
        </section>
        <section class="header-section controls-right">
          <button id="previous-frame" type="button" aria-label="Previous frame" disabled>◀</button>
          <button id="next-frame" type="button" aria-label="Next frame" disabled>▶</button>
        </section>
      </header>
      <section class="frame-container" aria-live="polite">
        <div id="frame-message">Loading mask review…</div>
        <div id="layer-grid" hidden></div>
      </section>
    </main>
    <script type="module" src="app.js?v=legacy-density-sweep-1"></script>
    <script type="module" src="magnifier.js"></script>
  </body>
</html>
