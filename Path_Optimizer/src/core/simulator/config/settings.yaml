dt: 0.01 # simulation integration interval (seconds)
duration: 12.0 # scenario duration (seconds)
max_steps: 2400

X_0: # initial state vector
  p_0: [0.0, 0.0, 0.0] # initial position (m)
  v_0: [0.0, 0.0, 0.0] # initial velocity (m/s)
  q_0: [1.0, 0.0, 0.0, 0.0] # initial attitude [w, x, y, z]
  omega_0: [0.0, 0.0, 0.0] # initial angular rates [p, q, r] (rad/s)

scenario:
  name: single_gate_min_time
  hover:
    target_position: [0.0, 0.0, 0.0]
    target_yaw: 0.0
  track:
    hover_duration: 1.0
    time_scale: 1.0
    settle_duration: 5.0

hover_controller:
  kp_pos: [1.4, 1.4, 2.0]
  kd_pos: [1.6, 1.6, 2.4]
  kp_att: [4.5, 4.5, 3.0]
  max_rate: [2.5, 2.5, 1.5]

track_controller:
  kp_pos: [2.4, 2.4, 3.2]
  kd_pos: [2.8, 2.8, 3.4]
  kp_att: [6.0, 6.0, 3.5]
  max_rate: [4.5, 4.5, 2.0]
  along_track_tolerance_m: 0.2
  lateral_tolerance_m: 0.2
  vertical_tolerance_m: 0.15
  velocity_tolerance_mps: 0.25
  forward_accel_floor_mps2: 3.0
  near_gate_distance_m: 7.0
  near_gate_tolerance_m: 0.05
  post_gate_decel_mps2: 8.0
  hover_capture_speed_mps: 0.35

environment:
  temperature: 15.0 # degrees (C)
  pressure: 101325.0 # pressure (Pa)
  air_density: 1.225 # air density for drag force computation [kg/m^3]
  wind_velocity_world: [0.0, 0.0, 0.0] # ambient wind velocity in world frame [vx, vy, vz] [m/s]
  g: 9.81 # gravity (m/s^2)
