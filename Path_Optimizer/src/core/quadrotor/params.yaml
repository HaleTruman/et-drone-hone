m: 1.2  # total mass [kg]
Ixx: 0.02  # body inertia about x-axis [kg*m^2]
Iyy: 0.02  # body inertia about y-axis [kg*m^2]
Izz: 0.04  # body inertia about z-axis [kg*m^2]
kf: 12.0  # thrust coefficient [N]
km: 0.15  # motor reaction torque coefficient [N*m]
Jr: 0.00006  # rotor polar inertia [kg*m^2]
l: [0.2, 0.2, 0.2, 0.2]  # motor arm lengths l1..l4 [m]
h: [0.0, 0.0, 0.0, 0.0]  # motor vertical offsets h1..h4 [m]
cd: [0.08, 0.08, 0.12]  # translational drag coefficients [N*s^2/m^2]
cr: [0.001, 0.001, 0.0015]  # rotational drag coefficients [N*m*s^2]
d: [1.0, -1.0, 1.0, -1.0]  # rotor spin direction signs [-]
g: 9.81  # gravitational acceleration [m/s^2]
